# Checks every instrument, builds each one's firmware with ESP-IDF and runs its simulator, when an
# instrument, the core or this tooling changes. Each build is kept as an artifact (entry-<id>).
name: instruments

on:
  push:
    branches: [main]
    paths: [instruments/**, core/**, tools/library.py, tools/core_files.txt, .github/workflows/library.yml]
  pull_request:
    paths: [instruments/**, core/**, tools/library.py, tools/core_files.txt, .github/workflows/library.yml]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
      listed: ${{ steps.ids.outputs.listed }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/library.py check
      - run: python3 tools/library.py core
      - id: ids
        run: |
          echo "ids=$(python3 tools/library.py ids)" >> "$GITHUB_OUTPUT"
          echo "listed=$(python3 tools/library.py ids --listed)" >> "$GITHUB_OUTPUT"

  entry:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.check.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1          # the release the core is developed on
          target: esp32s3
          path: instruments/${{ matrix.id }}/firmware
          command: idf.py build
      - name: The simulator
        # strict for the instruments on the list; for the rest, still in progress, its CPU budgets (measured on this
        # shared machine, slower than a desk) are a note, not a stop
        continue-on-error: ${{ !contains(fromJSON(needs.check.outputs.listed), matrix.id) }}
        run: |
          if [ -x instruments/${{ matrix.id }}/tools/sim/run.sh ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
            instruments/${{ matrix.id }}/tools/sim/run.sh
          else
            echo "no simulator"
          fi
      - run: python3 tools/library.py collect ${{ matrix.id }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: entry-${{ matrix.id }}
          path: dist

