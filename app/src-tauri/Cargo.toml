[package]
name = "samplooler-library"
version = "0.1.0"
description = "Install the Samplooler's instruments on a Stack"
authors = ["willbearfruits"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
serialport = "4"
midir = "0.11"
ureq = "2.12"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 0
